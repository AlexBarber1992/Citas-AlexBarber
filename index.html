<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AlexBarber - Agenda</title>
    <style>
        :root { 
            --fondo: #111; 
            --cian: #00f3ff; 
            --rosa: #ff007f; 
        }
        body { 
            background: var(--fondo); 
            color: white; 
            font-family: Arial, sans-serif; 
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .contenedor { 
            background: #1a1a1a; 
            padding: 30px; 
            border-radius: 15px; 
            box-shadow: 0 0 20px var(--cian); 
            text-align: center; 
            max-width: 400px; 
            width: 90%; 
        }
        img { 
            width: 120px; 
            display: block; 
            margin: 0 auto 15px; 
            border-radius: 50%;
        }
        h1 { 
            text-align: center; 
            color: var(--cian); 
            text-shadow: 0 0 10px var(--cian); 
            margin-bottom: 30px; 
        }
        button { 
            width: 100%; 
            padding: 15px; 
            background: transparent; 
            border: 2px solid var(--rosa); 
            color: white; 
            font-size: 18px; 
            font-weight: bold; 
            border-radius: 8px; 
            cursor: pointer; 
            box-shadow: 0 0 10px var(--rosa); 
            text-shadow: 0 0 5px var(--rosa); 
        }
    </style>
</head>
<body>

    <div class="contenedor">
        <!-- Revisa que este sea el nombre exacto de tu imagen -->
        <img src="Screenshot_2026-09-17-16-46-21-435_com.google.android.apps.photos-edit.jpg" alt="Logo AlexBarber">
        
        <h1>Citas AlexBarber</h1>
        
        <!-- Pega aquí tu enlace de Fresha -->
        <button onclick="window.open('https://www.fresha.com/book-now/alexbarber-jkjl0ee7/all-offer?share=true&pId=3098034')">Reservar Cita</button>
    </div>

</body>
</html>
